function processSpriteImage(im,{dropLightBg=false, cleanupWhiteHalo=false, aggressiveHalo=false}={}){
  const cvs=document.createElement('canvas');
  const w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
  cvs.width=w; cvs.height=h;
  const c=cvs.getContext('2d',{willReadFrequently:true});
  c.imageSmoothingEnabled=false;
  c.drawImage(im,0,0);
  const img=c.getImageData(0,0,w,h);
  const d=img.data;
  const idx=(x,y)=>((y*w+x)*4);
  const nearBg=(off,bg)=> Math.abs(d[off]-bg[0])<=22 && Math.abs(d[off+1]-bg[1])<=22 && Math.abs(d[off+2]-bg[2])<=22 && d[off+3]>0;

  if(dropLightBg){
    const bg=[d[0],d[1],d[2]];
    if(bg[0]>180 && bg[1]>180 && bg[2]>180){
      const seen=new Uint8Array(w*h);
      const q=[];
      const push=(x,y)=>{ if(x<0||x>=w||y<0||y>=h) return; const p=y*w+x; if(seen[p]) return; const off=idx(x,y); if(!nearBg(off,bg)) return; seen[p]=1; q.push(p); };
      for(let x=0;x<w;x++){ push(x,0); push(x,h-1); }
      for(let y=1;y<h-1;y++){ push(0,y); push(w-1,y); }
      for(let qi=0; qi<q.length; qi++){
        const p=q[qi], x=p%w, y=(p/w)|0, off=p*4;
        d[off+3]=0;
        push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1);
      }
    }
  }

  if(cleanupWhiteHalo){
    const copy=new Uint8ClampedArray(d);
    const transparentN=(x,y)=>{
      for(let yy=Math.max(0,y-1); yy<=Math.min(h-1,y+1); yy++) for(let xx=Math.max(0,x-1); xx<=Math.min(w-1,x+1); xx++){
        if(xx===x&&yy===y) continue;
        if(copy[idx(xx,yy)+3]===0) return true;
      }
      return false;
    };
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const off=idx(x,y), a=copy[off+3];
      if(!a) continue;
      const r=copy[off], g=copy[off+1], b=copy[off+2];
      if(r<220||g<220||b<220) continue;
      if(!transparentN(x,y)) continue;
      let best=null, bestScore=1e9;
      for(let yy=Math.max(0,y-2); yy<=Math.min(h-1,y+2); yy++) for(let xx=Math.max(0,x-2); xx<=Math.min(w-1,x+2); xx++){
        const o2=idx(xx,yy), a2=copy[o2+3];
        if(!a2 || (xx===x&&yy===y)) continue;
        const r2=copy[o2], g2=copy[o2+1], b2=copy[o2+2];
        const bright=r2+g2+b2;
        if(bright>520) continue;
        const dist=Math.abs(xx-x)+Math.abs(yy-y);
        const score=dist*100+bright;
        if(score<bestScore){bestScore=score; best=[r2,g2,b2,a2];}
      }
      if(best){ d[off]=best[0]; d[off+1]=best[1]; d[off+2]=best[2]; d[off+3]=best[3]; }
    }
  }

  if(aggressiveHalo){
    const copy2=new Uint8ClampedArray(d);
    const hasTransN=(x,y)=>{
      for(let yy=Math.max(0,y-1); yy<=Math.min(h-1,y+1); yy++) for(let xx=Math.max(0,x-1); xx<=Math.min(w-1,x+1); xx++){
        if(xx===x&&yy===y) continue;
        if(copy2[idx(xx,yy)+3]===0) return true;
      }
      return false;
    };
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const off=idx(x,y), a=copy2[off+3];
      if(!a) continue;
      const r=copy2[off], g=copy2[off+1], b=copy2[off+2];
      if(r<235||g<235||b<235) continue;
      if(!hasTransN(x,y)) continue;
      let best=null, bestScore=1e9;
      for(let yy=Math.max(0,y-3); yy<=Math.min(h-1,y+3); yy++) for(let xx=Math.max(0,x-3); xx<=Math.min(w-1,x+3); xx++){
        const o2=idx(xx,yy), a2=copy2[o2+3];
        if(!a2 || (xx===x&&yy===y)) continue;
        const r2=copy2[o2], g2=copy2[o2+1], b2=copy2[o2+2];
        if(r2>230&&g2>230&&b2>230) continue;
        const dist=Math.abs(xx-x)+Math.abs(yy-y);
        const score=dist*100 + (r2+g2+b2);
        if(score<bestScore){ bestScore=score; best=[r2,g2,b2,a2]; }
      }
      if(best){ d[off]=best[0]; d[off+1]=best[1]; d[off+2]=best[2]; d[off+3]=best[3]; }
      else { d[off+3]=0; }
    }
  }
  c.putImageData(img,0,0);
  return cvs;
}

function naturalSpeedKmh(t=elapsed){

  const keys=[[0,0],[1,5],[4,9],[8,12],[15,14.5],[22,16.5],[35,19],[60,22],[90,CFG.naturalSpeedCapKmh]];
  const tt=Math.max(0,t);

  const preCrash=speed;
  const naturalFloor=naturalSpeedInternal(elapsed);
  falls++;tries=Math.max(0,tries-1);speed=Math.max(naturalFloor*.55,speed*.58);jumpHeight=0;jumpHeld=false;jumpHoldT=0;jumpT=0;spinPending=false;jumpPower=0;jumpPhase='none';jumpPhaseT=0;breakCombo();resetJumpSeq();
  // The object that caused the crash can never hit the player a second time.
  if(hitObstacle)hitObstacle.hit=true;
  // Keep world momentum while the fall/get-up plays so large hazards actually clear.
  crashCarrySpeed=Math.max(preCrash,CFG.startSpeed);crashCarryT=CFG.crashCarrySeconds;
  invuln=CFG.fallTime+CFG.getupTime+CFG.postFallInvuln;
  gameOverPending=tries<=0;
  impactFlashT=.18;
  if(hitObstacle)playSfxSafe('collision');
  playSfxSafe('fall',65);
  if(tries===1){
    playSfxSafe('lastTry',120);
    spawnFloat('ÚLTIMO TRY',PLAYER_X+85,laneY-92,'danger');
    flash('ÚLTIMO TRY');
  } else if(gameOverPending){
    flash('GAME OVER');
  } else {
    flash('CAIU!');
  }
  setState('fall');
}

function applyKeyboardLateral(dt){
  const dir=(keys.down?1:0)-(keys.up?1:0);
  if(dir&&state==='idle')startRolling();
  if(!dir||state==='fall'||state==='getup'){ if(!dir)kbdPrevDir=0; return; }
  const before=laneY;
  laneY=clamp(laneY+dir*CFG.keyboardLateralPxPerSec*dt,LANE_MIN,LANE_MAX);
  const moved=Math.abs(laneY-before);
  if(dir===kbdPrevDir||kbdPrevDir===0){kbdTravel+=moved;}
  else {if(kbdTravel>=CFG.pumpTravel)triggerPump();kbdTravel=moved;}
  kbdPrevDir=dir;
}

function applyTouchDelta(dy){
  if(state==='fall'||state==='getup')return;
  const logical=dy*CFG.touchSensitivity;
  if(logical&&state==='idle')startRolling();
  laneY=clamp(laneY+logical,LANE_MIN,LANE_MAX);
  const dir=Math.sign(logical);
  if(!dir)return;
  if(touchPrevDir===0||dir===touchPrevDir){touchTravel+=Math.abs(logical);}
  else {if(touchTravel>=CFG.pumpTravel)triggerPump();touchTravel=Math.abs(logical);}
  touchPrevDir=dir;
}

function updatePlayer(dt){
  stateT+=dt;invuln=Math.max(0,invuln-dt);applyKeyboardLateral(dt);
  updateRunSpeed(dt);

  const jumping=(state==='crouch'||state==='takeoff'||state==='airborne'||state==='spin');
  if(jumping){
    jumpT+=dt;
    jumpPhaseT+=dt;

    if(jumpPhase==='rise'){
      const p=clamp(jumpPhaseT/CFG.jumpRiseTime,0,1);
      jumpHeight=CFG.jumpPeakHeight*(1-Math.pow(1-p,2));
      if(p>=1){
        jumpHeight=CFG.jumpPeakHeight;
        jumpPhaseT=0;
        if(jumpHeld){jumpPhase='hang';}
        else {jumpPhase='fall';}
      }
    } else if(jumpPhase==='hang'){
      jumpHeight=CFG.jumpPeakHeight;
      if(jumpHeld&&jumpHoldT<CFG.jumpSustainMax){
        jumpHoldT+=dt;
      }
      if(!jumpHeld||jumpHoldT>=CFG.jumpSustainMax){
        jumpPhase='fall';jumpPhaseT=0;
      }
    } else if(jumpPhase==='fall'){
      const p=clamp(jumpPhaseT/CFG.jumpFallTime,0,1);
      jumpHeight=CFG.jumpPeakHeight*(1-p*p);
      if(p>=1){
        jumpHeight=0;jumpHeld=false;jumpPhase='none';jumpPhaseT=0;playSfxSafe('land');setState('landing');
      }
    }

    jumpPower=clamp(jumpHoldT/CFG.jumpSustainMax,0,1);
    if(state==='crouch'&&stateT>=CFG.crouchTime)setState('takeoff');
    else if(state==='takeoff'&&stateT>=CFG.takeoffTime){setState(spinPending?'spin':'airborne');spinPending=false;}
    else if(state==='spin'&&stateT>=CFG.spinDuration)setState('airborne');
  } else if(state==='landing'){
    jumpHeight=0;if(stateT>=CFG.landingTime){finalizeJumpSeq();jumpPower=0;jumpHoldT=0;jumpPhase='none';setState('locomotion');}
  } else if(state==='fall'){
    if(stateT>=CFG.fallTime)setState('getup');
  } else if(state==='getup'){
    if(stateT>=CFG.getupTime){if(gameOverPending)finishRun();else setState('locomotion');}
  }
}

function makeObstacle(type,xOffset=0){
  const def=typeDefs[type];
  const spawnX=(type==='person'?W+70+def.w/2:W+70)+xOffset;
  const o={type,def:{...def},x:spawnX,age:0,passed:false,hit:false};
  if(def.full)o.lane=815;
  else if(type==='dog'){
    o.startLane=ROAD_TOP-30;o.centerLane=(ROAD_TOP+ROAD_BOTTOM)/2;o.endLane=ROAD_BOTTOM+32;o.lane=o.startLane;
    o.dogPhase='waiting';o.dogActivated=false;o.collisionActive=false;
  } else o.lane=pick(LANE_POINTS)+rand(-8,8);

  if(type==='bag'){
    const s=rand(1.08,1.42);
    o.spriteScale=s;
    o.def.w=Math.round(o.def.w*s);
    o.def.laneHalf=Math.round(o.def.laneHalf*(0.92+s*0.08));
    o.def.clearance=Math.round(o.def.clearance*Math.min(1.12,s));
  }
  return o;
}
function laneBlocked(o,lane,action){
  if(o.def.full)return action!=='jump';
  const overlap=Math.abs(o.lane-lane)<(o.def.laneHalf+25);if(!overlap)return false;
  if(o.type==='person')return true;return action!=='jump';
}
function groupHasVisualOverlap(group){
  // Rejects literal scenic overlap. Two hazards may form a gate, but their proxy/art bounds
  // cannot sit on top of each other.
  for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++){
    const a=group[i],b=group[j];
    const xOverlap=Math.abs(a.x-b.x)<(a.def.w+b.def.w)/2+18;
    const yOverlap=Math.abs(a.lane-b.lane)<(a.def.laneHalf+b.def.laneHalf)+14;
    if(xOverlap&&yOverlap)return true;
  }
  return false;
}
function validGroup(group){
  if(groupHasVisualOverlap(group))return false;
  // Conservative fairness check: at least one tested road lane must remain solvable either on ground or in jump.
  for(const lane of LANE_POINTS)for(const action of ['ground','jump']){
    let ok=true;for(const o of group)if(laneBlocked(o,lane,action)){ok=false;break;}if(ok)return true;
  }
  return false;
}
function topSpeedPressure(){
  // Continuous pressure only in the upper part of the speed curve:
  // 26 km/h = 0 pressure, 30 km/h = full pressure.
  return clamp((displaySpeedKmh(speed)-25.5)/4.5,0,1);
}
function spawnGapRange(){
  const p=topSpeedPressure();
  // Keep early/mid game identical; compress the clear-road distance only near 30 km/h.
  return {
    min:lerp(CFG.spawnGapMin,280,p),
    max:lerp(CFG.spawnGapMax,420,p)
  };
}
function generateGroup(){
  // RNG stays fair, but the composition becomes more demanding continuously near 30 km/h.
  // DOG remains solo because its approved timed crossing is already a moving hazard sequence.
  const staticTypes=['hole','bag','bump','puddle','manhole','person'];
  const gateTypes=['bag','puddle','manhole'];
  const pressure=topSpeedPressure();

  // At low speed: 52% single / 28% gate / 20% sequential.
  // At 30 km/h: 30% single / 18% gate / 52% sequential.
  const singleCut=lerp(.52,.24,pressure);
  const gateCut=singleCut+lerp(.28,.14,pressure);

  for(let attempt=0;attempt<40;attempt++){
    const roll=Math.random();
    let group=[];

    if(roll<singleCut){
      group=[makeObstacle(pick(typeKeys),0)];
    }
    else if(roll<gateCut){
      // Same-X gates are restricted to compact localized hazards and must be visibly separated.
      const first=pick(gateTypes);
      let second=pick(gateTypes.filter(t=>t!==first));
      const a=makeObstacle(first,0),b=makeObstacle(second,0);
      group=[a,b];
    }
    else {
      const first=pick(staticTypes);
      const second=pick(staticTypes);
      const a=typeDefs[first],b=typeDefs[second];
      // Reaction window tightens continuously near the top, but never becomes a scenic overlap.
      const clearRoad=rand(lerp(175,132,pressure),lerp(265,182,pressure));
      const offset=(a.w+b.w)/2+clearRoad;
      group=[makeObstacle(first,0),makeObstacle(second,offset)];
    }

    if(validGroup(group))return group;
  }
  return [makeObstacle(pick(typeKeys),0)];
}
function updateDog(o,dt){
  // The dog waits on the sidewalk until it is clearly visible. Then: bark -> walk to middle -> bark -> hold -> finish crossing.
  // This keeps the approved telegraph valid at both low and high speeds.
  const triggerX=W-55;
  if(!o.dogActivated){
    o.dogPhase='waiting';o.lane=o.startLane;o.collisionActive=false;
    if(o.x<=triggerX){o.dogActivated=true;o.age=0;o.dogPhase='bark1';}
    return;
  }
  o.age+=dt;
  if(o.age<.58){o.dogPhase='bark1';o.lane=o.startLane;o.collisionActive=false;}
  else if(o.age<1.55){const t=(o.age-.58)/.97;o.dogPhase='walk1';o.lane=o.startLane+(o.centerLane-o.startLane)*t;o.collisionActive=o.lane>=ROAD_TOP&&o.lane<=ROAD_BOTTOM;}
  else if(o.age<2.18){o.dogPhase='bark2';o.lane=o.centerLane;o.collisionActive=true;}
  else if(o.age<3.55){o.dogPhase='hold';o.lane=o.centerLane;o.collisionActive=true;}
  else if(o.age<4.75){const t=(o.age-3.55)/1.20;o.dogPhase='walk2';o.lane=o.centerLane+(o.endLane-o.centerLane)*t;o.collisionActive=o.lane<=ROAD_BOTTOM;}
  else{o.dogPhase='done';o.lane=o.endLane;o.collisionActive=false;}
}
function updateObstacles(dt,allowSpawn=true,worldSpeed=speed){
  const kmh=displaySpeedKmh(worldSpeed);
  const vx=worldSpeed*CFG.speedPxPerKmh*speedVisualMultiplier(kmh);distance+=vx*dt;
  if(allowSpawn&&distance>=nextSpawn){
    const active=obstacles.filter(o=>o.x+o.def.w/2>-80&&o.x-o.def.w/2<W+180).length;
    if(active<CFG.maxActiveObstacles){
      const group=generateGroup();
      const clear=spawnGapRange();
      const newLeft=Math.min(...group.map(o=>o.x-o.def.w/2));
      const existingRight=obstacles.length?Math.max(...obstacles.map(o=>o.x+o.def.w/2)):-Infinity;
      const minScreenGap=lerp(120,64,topSpeedPressure());

      if(existingRight!==-Infinity&&newLeft-existingRight<minScreenGap){
        // Delay instead of allowing two scenic elements to visually stack.
        nextSpawn=distance+Math.max(55,minScreenGap-(newLeft-existingRight));
      }else{
        obstacles.push(...group);
        const groupSpan=Math.max(...group.map(o=>(o.x-(W+70))+o.def.w/2));
        nextSpawn=distance+groupSpan+rand(clear.min,clear.max);
      }
    }else nextSpawn=distance+rand(90,150);
  }
  for(const o of obstacles){
    o.x-=vx*dt;
    if(o.type==='dog')updateDog(o,dt);else o.age+=dt;
    if(!o.passed&&o.x+o.def.w/2<PLAYER_X-25){o.passed=true;registerObstacleClear(o);}
  }
  obstacles=obstacles.filter(o=>o.x+o.def.w/2>-100);
}
function checkCollisions(){
  if(invuln>0||state==='fall'||state==='getup')return;
  const pxHalf=20,laneHalf=17;
  for(const o of obstacles){
    if(o.hit)continue;
    if(o.type==='dog'&&!o.collisionActive)continue;
    if(Math.abs(o.x-PLAYER_X)>o.def.w/2+pxHalf)continue;
    if(!(o.def.full||Math.abs(o.lane-laneY)<o.def.laneHalf+laneHalf))continue;
    if(jumpHeight<o.def.clearance){doFall(o);return;}
  }
}
function update(dt){
  ambientElapsed+=dt;
  if(gameOver){
    updateFeedback(dt);if(toastT>0){toastT-=dt;ui.toast.style.opacity=String(clamp(toastT/.25,0,1));}else ui.toast.style.opacity='0';
    return;
  }
  if(!rolling){
    updateFeedback(dt);if(toastT>0){toastT-=dt;ui.toast.style.opacity=String(clamp(toastT/.25,0,1));}else ui.toast.style.opacity='0';
    return;
  }
  elapsed+=dt;updatePlayer(dt);runMaxDisplaySpeed=Math.max(runMaxDisplaySpeed,displaySpeedKmh(speed));
  if(state==='fall'||state==='getup'){
    const carry=crashCarryT>0?Math.max(speed,crashCarrySpeed):speed;
    updateObstacles(dt,false,carry);
    crashCarryT=Math.max(0,crashCarryT-dt);
    if(crashCarryT<=0)crashCarrySpeed=speed;
  }else updateObstacles(dt,true,speed);
  checkCollisions();
  // Survival matters, but obstacle execution remains the main source of score.
  // Do not award survival points during a crash/get-up animation.
  if(state!=='fall'&&state!=='getup'){
    const kmh=displaySpeedKmh(speed);
    addScore(dt*10);                               // base survival
    addScore(Math.max(0,kmh-10)*dt*.55);          // sustained speed
    if(kmh>=25)addScore((kmh-24)*dt*2.4);         // meaningful late-game risk bonus
    if(!riskPeakAnnounced&&kmh>=29.4){riskPeakAnnounced=true;}
  }
  updateFeedback(dt);
  if(toastT>0){toastT-=dt;ui.toast.style.opacity=String(clamp(toastT/.25,0,1));}else ui.toast.style.opacity='0';
  hintT+=dt;if(hintT>7)ui.hint.style.opacity='.18';
}

function jaggedRect(x,y,w,h,steps=8){
  const pts=[],amp=6;pts.push([x,y]);
  for(let i=1;i<=steps;i++)pts.push([x+w*i/steps,y+rand(-amp,amp)]);
  for(let i=1;i<=steps;i++)pts.push([x+w+rand(-amp,amp),y+h*i/steps]);
  for(let i=steps-1;i>=0;i--)pts.push([x+w*i/steps,y+h+rand(-amp,amp)]);
  for(let i=steps-1;i>=0;i--)pts.push([x+rand(-amp,amp),y+h*i/steps]);
  ctx.beginPath();ctx.moveTo(...pts[0]);for(const p of pts.slice(1))ctx.lineTo(...p);ctx.closePath();
}

  ctx.restore();
}
function frameIndexFor(stateName,def){
  const n=def.frames.length;if(n<=1)return 0;
  if(stateName==='idle')return 0;
  if(stateName==='locomotion'){
    const kmh=displaySpeedKmh(speed);
    const speedFactor=lerp(.58,2.35,Math.pow(clamp(kmh/30,0,1),.85));
    const cycle=def.durations.reduce((a,b)=>a+b,0)/speedFactor;
    let t=(stateT%cycle)*speedFactor,acc=0;
    for(let i=0;i<n;i++){acc+=def.durations[i];if(t<acc)return i;}
    return n-1;
  }
  if(stateName==='spin')return Math.min(n-1,Math.floor(clamp(stateT/CFG.spinDuration,0,.9999)*n));
  const playDur= stateName==='crouch'?CFG.crouchTime : stateName==='takeoff'?CFG.takeoffTime : stateName==='landing'?CFG.landingTime : stateName==='fall'?CFG.fallTime : stateName==='getup'?CFG.getupTime : .72;
  if(stateName==='airborne')return Math.floor((stateT/.095)%n);
  return Math.min(n-1,Math.floor(clamp(stateT/playDur,0,.9999)*n));
}
function drawPlayer(){
  const def=spriteDefs[state]||spriteDefs.locomotion;
  const arr=sprites[state]||sprites.locomotion;
  const idx=frameIndexFor(state,def),im=arr[idx]||arr[0];
  const iw=im?(im.naturalWidth||im.width||0):0, ih=im?(im.naturalHeight||im.height||0):0;
  if(!im||!iw||!ih)return;
  let scale=(def.scales&&def.scales[idx])||1;
  if(state==='spin') scale*=1.06;
  if(state==='fall') scale*=1.07;
  const anchor=(def.anchors&&def.anchors[idx])||[iw/2,ih];
  const dw=Math.round(iw*scale),dh=Math.round(ih*scale);
  const dx=Math.round(PLAYER_X-anchor[0]*scale);
  const dy=Math.round(laneY-jumpHeight-anchor[1]*scale);
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(im,dx,dy,dw,dh);
  ctx.restore();
  if(showDebug){
    const bb=def.bboxes&&def.bboxes[idx];
    ctx.save();ctx.strokeStyle='#4cff74';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    if(bb)ctx.strokeRect(Math.round(dx+bb[0]*scale),Math.round(dy+bb[1]*scale),Math.round((bb[2]-bb[0])*scale),Math.round((bb[3]-bb[1])*scale));
    ctx.setLineDash([]);ctx.strokeStyle='#ffcf22';ctx.beginPath();ctx.moveTo(PLAYER_X-7,Math.round(laneY-jumpHeight));ctx.lineTo(PLAYER_X+7,Math.round(laneY-jumpHeight));ctx.moveTo(PLAYER_X,Math.round(laneY-jumpHeight)-7);ctx.lineTo(PLAYER_X,Math.round(laneY-jumpHeight)+7);ctx.stroke();ctx.restore();
  }
}

function drawLoopLayer(im,def){
  const iw=im?(im.naturalWidth||im.width||0):0;
  if(!iw)return false;
  const shift=(distance*def.factor)%iw;
  let x=-shift;
  while(x>0)x-=iw;
  ctx.drawImage(im,Math.round(x),def.y,iw,def.h);
  if(x+iw<W)ctx.drawImage(im,Math.round(x+iw),def.y,iw,def.h);

}

function touchZone(clientX){

  const now=performance.now();
  try{stage.setPointerCapture(e.pointerId)}catch(_){ }

  if(zone==='steer'){
    if(steerPointer.id!==null)return;
    steerPointer.id=e.pointerId;steerPointer.lastY=e.clientY;
    touchPrevDir=0;touchTravel=0;

  }

  if(actionPointer.id!==null)return;
  actionPointer.id=e.pointerId;actionPointer.startT=now;actionPointer.spinGesture=false;

  // ACTION zone has no gesture ambiguity: pointer-down can jump instantly.
  if(now-lastTapAt<=CFG.doubleTapMs){
    actionPointer.spinGesture=true;lastTapAt=-9999;
    if(state==='locomotion'||state==='landing')beginJump(true);
    else setJumpHeld(true);
    requestSpin();

    if(state==='locomotion'||state==='landing')beginJump(true);

  }
});

function finishPointer(e){
  if(e.pointerId===steerPointer.id){
    e.preventDefault();
    steerPointer.id=null;touchPrevDir=0;touchTravel=0;
    return;

  if(e.pointerId!==actionPointer.id)return;
  e.preventDefault();
  const now=performance.now(),duration=now-actionPointer.startT;
  const wasSpin=actionPointer.spinGesture;
  actionPointer.id=null;actionPointer.spinGesture=false;

// One definitive Stage-12 ambience build.
function spgPlaceBeerManOnWall(){
  if(!Array.isArray(stage12SeatPlacements))stage12SeatPlacements=[];
  stage12SeatPlacements=stage12SeatPlacements.filter(v=>!spgSeatHas(v,'beerman'));

  const wallCycle=proceduralWallCycleWidth||24000;
  const spans=stage11FlatSpans();
  const scale=0.81225;
  const d=stage12AnimatedDefs.beerman;
  const w=Math.round(d.w*scale);

  const womanPlacement=(stage11Placements||[]).find(p=>p.id==='sitWomanHavaianas');
  const womanDef=womanPlacement?stage11Defs?.sitWomanHavaianas:null;

  // V05 LOCK: beer man is a visual pair with the seated woman.
  // World moves from higher wx toward lower screen-x, so a GREATER wx means he is encountered AFTER her.
  const pairGap=8;
  const womanRight=womanPlacement&&womanDef ? womanPlacement.wx+womanDef.w : null;
  const desiredLeft=womanRight!==null ? womanRight+pairGap : null;

  // Woman is intentionally excluded from collision occupancy here so the pair can sit close.
  const occupied=(stage11Placements||[]).filter(p=>p.id!=='sitWomanHavaianas').map(p=>{
    const dd=stage11Defs?.[p.id];
    return dd?{c:spgCircularCenter(p.wx,dd.w,wallCycle),r:dd.w/2+70,id:p.id}:null;
  }).filter(Boolean);

  const familyCenters=(stage11Placements||[])
    .filter(p=>SPG_MURETA_OCCUPANTS.has(p.id)&&p.id!=='sitWomanHavaianas')
    .map(p=>{
      const dd=stage11Defs[p.id];
      return spgCircularCenter(p.wx,dd.w,wallCycle);
    });

  const familyMinGap=Math.min(3900,wallCycle*.16);

  function validAfterWoman(cand){
    if(womanRight!==null && cand<womanRight+pairGap)return false;
    const margin=12;
    const fitsFlat=spans.some(span=>cand>=span.x0+margin && cand+w<=span.x1-margin);
    if(!fitsFlat)return false;

    const c=spgCircularCenter(cand,w,wallCycle);
    if(occupied.some(z=>spgDistance(c,z.c,wallCycle)<w/2+z.r))return false;
    if(familyCenters.some(fc=>spgDistance(c,fc,wallCycle)<familyMinGap))return false;
    return true;
  }

  let wx=null;

  if(desiredLeft!==null){
    // First choice: immediately after the woman, with only an 8 px world-space gap.
    for(const off of [0,8,16,28,44,64,88,120,160,210]){
      const cand=Math.round(desiredLeft+off);
      if(validAfterWoman(cand)){wx=cand;break;}
    }

    // If her exact wall segment is tight, use the nearest subsequent valid flat segment.
    // Never search backwards: the man must ALWAYS come after the woman.
    if(wx===null){
      const laterSpans=spans
        .filter(span=>span.x1>desiredLeft)
        .slice()
        .sort((a,b)=>Math.max(a.x0+12,desiredLeft)-Math.max(b.x0+12,desiredLeft));

      let best=null,bestDelta=Infinity;
      for(const span of laterSpans){
        const minX=Math.max(span.x0+12,desiredLeft);
        const maxX=span.x1-12-w;
        if(maxX<minX)continue;
        for(const off of [0,16,32,56,88,128,176]){
          const cand=Math.min(maxX,minX+off);
          if(!validAfterWoman(cand))continue;
          const delta=cand-desiredLeft;
          if(delta<bestDelta){bestDelta=delta;best=Math.round(cand);}
          break;
        }
      }
      if(best!==null)wx=best;
    }
  }

  // Defensive fallback only if the woman is missing from the generated wall layout.
  if(wx===null && womanRight===null){
    const targets=[.85,.80,.90,.73,.95,.68].map(v=>v*wallCycle);
    for(const target of targets){
      const sorted=spans.slice().sort((a,b)=>spgDistance((a.x0+a.x1)/2,target,wallCycle)-spgDistance((b.x0+b.x1)/2,target,wallCycle));
      for(const span of sorted){
        const minX=span.x0+20,maxX=span.x1-20-w;
        if(maxX<minX)continue;
        const cand=Math.max(minX,Math.min(maxX,Math.round(target-w/2)));
        const c=spgCircularCenter(cand,w,wallCycle);
        if(occupied.some(z=>spgDistance(c,z.c,wallCycle)<w/2+z.r))continue;
        wx=Math.round(cand);break;
      }
      if(wx!==null)break;
    }
  }

  // Absolute order guarantee: if an unusual generated layout leaves no protected slot,
  // keep him directly after the woman rather than allowing a before-her fallback.
  if(wx===null && desiredLeft!==null)wx=Math.round(desiredLeft);

  if(wx===null)wx=Math.round(wallCycle*.85);

  const seatedBottom=Math.round(501+stage12AnimatedDefs.beerman.h*0.855*0.45)-10;
  stage12SeatPlacements.push({
    wx,
    wallTop:true,
    supportId:null,
    supportScale:1,
    supportBottom:626,
    chars:[{id:'beerman',dx:0,bottom:seatedBottom,scale,flip:false,animPhase:0,animSpeed:1}]
  });
}

// ---------------------------------------------------------------------------
// V13.15.2 — FAMILY COOLDOWNS + PROTECTION HIERARCHY
// Families here mean spatial/temporal role, not visual similarity.
// 1) MURETA_OCCUPANTS: people sitting/occupying the top of the wall.
// 2) CALCADA_STATIC_PROPS: the Step A + selected Step B loose static props
//    approved by QA. Counts are preserved; members are redistributed, not deleted.
// ---------------------------------------------------------------------------
const SPG_MURETA_OCCUPANTS=new Set(['sitYellow','sitDark','sitWomanHavaianas']);
const SPG_CALCADA_STATIC_PROPS=new Set(['bag','bike','bin','boxes','cart','chair','crate','cylinder','barricade','cone','skate']);
const SPG_STEPB_FAMILY=new Set(['barricade','cone','skate']);
const SPG_STEPA_FAMILY=new Set(['bag','bike','bin','boxes','cart','chair','crate','cylinder']);

function spgNormalizeX(x,cycle=STAGE5_CYCLE){return ((x%cycle)+cycle)%cycle;}
function spgCircularEdgeGap(wxA,wA,wxB,wB,cycle=STAGE5_CYCLE){
  const a=spgCircularCenter(wxA,wA,cycle),b=spgCircularCenter(wxB,wB,cycle);
  return spgDistance(a,b,cycle)-(wA+wB)/2;
}
function spgFamilyCandidateBlocked(wx,w,placedFamily,allStatic,treeItems){
  // Family cooldown: same ambient class cannot form a visual train.
  if((placedFamily||[]).some(z=>spgCircularEdgeGap(wx,w,z.wx,z.w,STAGE5_CYCLE)<150))return true;
  // Preserve the tree breathing room from Block 1.
  if((treeItems||[]).some(t=>{
    const d=stage5AssetDefs?.tree;return d&&spgCircularEdgeGap(wx,w,t.wx,d.w,STAGE5_CYCLE)<210;
  }))return true;
  // Preserve every Step B module, with stronger padding on protected/story modules.
  if(Array.isArray(stage5BPlacements))for(const p of stage5BPlacements){
    const d=stage5BDefs?.[p.id];if(!d)continue;
    const pad=(p.id==='hotdog'||p.id==='busstop')?120:(p.id==='coupleBench'||p.id==='motoboy'?90:42);
    if(spgCircularEdgeGap(wx,w,p.wx,d.w,STAGE5_CYCLE)<pad)return true;
  }
  // Preserve V87 character/story placements.
  if(Array.isArray(stage5V87Placements))for(const p of stage5V87Placements){
    const d=stage5V87Defs?.[p.id];if(!d||d.layer!=='sidewalk')continue;
    const ww=Math.round(d.w*(p.scale||1));
    if(spgCircularEdgeGap(wx,w,p.wx,ww,STAGE5_CYCLE)<80)return true;
  }
  // Do not physically stack on a non-family Step A item.
  if((allStatic||[]).some(o=>o!==null&&!SPG_STEPA_FAMILY.has(o.id)&&o.id!=='tree'&&(()=>{const od=stage5AssetDefs?.[o.id];return od&&spgCircularEdgeGap(wx,w,o.wx,od.w,STAGE5_CYCLE)<18;})()))return true;
  return false;
}

function spgReorderStepAFamilyIds(r){
  const items=(stage5Items||[]).filter(it=>SPG_STEPA_FAMILY.has(it.id)).sort((a,b)=>a.wx-b.wx);
  if(items.length<2)return;
  const remaining=new Map();for(const it of items)remaining.set(it.id,(remaining.get(it.id)||0)+1);
  const recent=[];
  for(const it of items){
    let candidates=[...remaining.entries()].filter(([id,n])=>n>0&&!recent.slice(-3).includes(id)).map(([id])=>id);
    if(!candidates.length)candidates=[...remaining.entries()].filter(([id,n])=>n>0&&!recent.slice(-2).includes(id)).map(([id])=>id);
    if(!candidates.length)candidates=[...remaining.entries()].filter(([,n])=>n>0).map(([id])=>id);
    let max=Math.max(...candidates.map(id=>remaining.get(id)||0));
    candidates=candidates.filter(id=>(remaining.get(id)||0)>=max-1);
    const id=candidates[Math.floor(r()*candidates.length)];
    it.id=id;remaining.set(id,remaining.get(id)-1);spgPushRecent(recent,id,3);
  }
}

function spgApplyCalcadaFamilyCooldown(){
  if(!Array.isArray(stage5Items)||!stage5Items.length)return;
  const r=stage5Rng((stage5Seed^0x15151FA1)>>>0);
  // First: same exact Step A asset must not recur in a short family sequence.
  spgReorderStepAFamilyIds(r);

  const treeItems=stage5Items.filter(it=>it.id==='tree');
  const fixedFamily=[];
  if(Array.isArray(stage5BPlacements))for(const p of stage5BPlacements){
    if(!SPG_STEPB_FAMILY.has(p.id))continue;
    const d=stage5BDefs?.[p.id];if(d)fixedFamily.push({wx:p.wx,w:d.w,id:p.id,source:'B'});
  }
  const placedFamily=fixedFamily.slice();
  const familyItems=stage5Items.filter(it=>SPG_STEPA_FAMILY.has(it.id)).sort((a,b)=>a.wx-b.wx);
  const allStatic=stage5Items.slice();
  const offsets=[0,-110,110,-220,220,-330,330,-460,460,-600,600,-760,760,-920,920];
  for(const it of familyItems){
    const d=stage5AssetDefs?.[it.id];if(!d)continue;
    const original=it.wx;
    let chosen=null;
    for(const off of offsets){
      const cand=spgNormalizeX(Math.round(original+off+(off===0?0:(r()-.5)*24)),STAGE5_CYCLE);
      if(cand<24||cand+d.w>STAGE5_CYCLE-24)continue;
      if(spgFamilyCandidateBlocked(cand,d.w,placedFamily,allStatic,treeItems))continue;
      chosen=cand;break;
    }
    if(chosen===null){
      // Never delete the prop. Relax only the family gap, while protected/story/tree areas stay sacred.
      for(let x=36;x<STAGE5_CYCLE-d.w-36;x+=74){
        const hardBlocked=(treeItems||[]).some(t=>{const td=stage5AssetDefs?.tree;return td&&spgCircularEdgeGap(x,d.w,t.wx,td.w,STAGE5_CYCLE)<190;})
          ||(stage5BPlacements||[]).some(p=>{const bd=stage5BDefs?.[p.id];if(!bd)return false;const pad=(p.id==='hotdog'||p.id==='busstop')?105:(p.id==='coupleBench'||p.id==='motoboy'?78:24);return spgCircularEdgeGap(x,d.w,p.wx,bd.w,STAGE5_CYCLE)<pad;})
          ||(stage5V87Placements||[]).some(p=>{const vd=stage5V87Defs?.[p.id];if(!vd||vd.layer!=='sidewalk')return false;return spgCircularEdgeGap(x,d.w,p.wx,Math.round(vd.w*(p.scale||1)),STAGE5_CYCLE)<70;});
        if(hardBlocked)continue;
        if(placedFamily.some(z=>spgCircularEdgeGap(x,d.w,z.wx,z.w,STAGE5_CYCLE)<90))continue;
        chosen=x;break;
      }
    }
    if(chosen!==null)it.wx=chosen;
    placedFamily.push({wx:it.wx,w:d.w,id:it.id,source:'A'});
  }
  stage5Items.sort((a,b)=>a.wx-b.wx);
}

function spgFindWallFamilySlot(id,target,occupied,familyCenters,minFamilyGap){
  const cycle=proceduralWallCycleWidth||24000,d=stage11Defs?.[id];if(!d)return null;
  const spans=stage11FlatSpans();
  const treeDef=stage5AssetDefs?.tree;
  const treeBlocks=treeDef?(stage5Items||[]).filter(it=>it.id==='tree').map(it=>({x0:it.wx-90,x1:it.wx+treeDef.w+90})):[];
  const posterDef=stage5V87Defs?.wallPosters;
  const posterBlocks=posterDef?(stage5V87Placements||[]).filter(p=>p.id==='wallPosters').map(p=>({x0:p.wx-12,x1:p.wx+posterDef.w+12})):[];
  const overlapLinear=(x,w,blocks)=>blocks.some(b=>x<b.x1&&x+w>b.x0);
  const sorted=spans.slice().sort((a,b)=>spgDistance((a.x0+a.x1)/2,target,cycle)-spgDistance((b.x0+b.x1)/2,target,cycle));
  for(const s of sorted){
    if(s.x1-s.x0<d.w+70)continue;
    const minX=s.x0+28,maxX=s.x1-28-d.w;if(maxX<minX)continue;
    const pref=Math.max(minX,Math.min(maxX,Math.round(target-d.w/2)));
    for(const off of [0,-60,60,-120,120,-200,200,-300,300,-420,420]){
      const cand=Math.max(minX,Math.min(maxX,pref+off));
      if(overlapLinear(cand,d.w,treeBlocks)||overlapLinear(cand,d.w,posterBlocks))continue;
      const c=spgCircularCenter(cand,d.w,cycle);
      if((occupied||[]).some(z=>spgDistance(c,z.c,cycle)<d.w/2+z.r+46))continue;
      if((familyCenters||[]).some(fc=>spgDistance(c,fc,cycle)<minFamilyGap))continue;
      return Math.round(cand);
    }
  }
  return null;
}

function spgApplyMuretaFamilyCooldown(){
  if(!Array.isArray(stage11Placements)||!stage11Placements.length)return;
  const cycle=proceduralWallCycleWidth||24000,r=stage5Rng((stage5Seed^0x1515AA71)>>>0);

  const familyCenters=[];
  const targets=[.10,.35,.60].map(v=>v*cycle),minGap=Math.min(3900,cycle*.16),placed=[];
  for(let i=0;i<familyIds.length;i++){

      const old=stage11Placements.find(p=>p.id===id);wx=old?old.wx:Math.round(targets[i%targets.length]);

}

// ---------------------------------------------------------------------------
// V13.15.2 — PROTECTION HIERARCHY / WORLD-SPACE REPOSITIONING
// Priority order:
//   1. MURETA occupants (Stage 11 + beer man)
//   2. Trees (Stage5 tree + city treeClean)
//   3. Protected sidewalk/story owners (bus stop, hot dog, motoboy,
//      smoker + ice-cream + Shar Pei)
//   4. Common ambience
// Conflicts are solved by REPOSITIONING at rebuild time. Draw-time guards are
// only a final safety net and never decide visibility frame-by-frame.
// ---------------------------------------------------------------------------
function spgProjectedConflictCount(wx,w,cycle,zones,pad=0,reps=4){
  let hits=0;
  const half=w/2;
  for(let n=0;n<reps;n++){
    const c=wx+half+n*cycle;
    for(const z of (zones||[])){
      const zc=z.cycle||cycle, zr=z.r||0;
      const m=Math.round((c-z.c)/zc);
      let hit=false;
      for(let dm=-1;dm<=1;dm++){
        const zabs=z.c+(m+dm)*zc;
        if(Math.abs(c-zabs)<half+zr+pad){hit=true;break;}
      }
      if(hit)hits++;
    }
  }
  return hits;
}
function spgProjectedSafe(wx,w,cycle,zones,pad=0,reps=4){
  return spgProjectedConflictCount(wx,w,cycle,zones,pad,reps)===0;
}
function spgSameCycleGap(wx,w,otherWx,otherW,cycle=STAGE5_CYCLE){
  return spgCircularEdgeGap(wx,w,otherWx,otherW,cycle);
}
function spgRelocateStage5BForProtection(){
  if(!Array.isArray(stage5BPlacements)||!stage5BPlacements.length)return;
  const r=stage5Rng((stage5Seed^0x15152026)>>>0);
  const wallZones=spgProtectedWallZones();
  const treeZones=spgAllTreeZones();
  const offsets=[0,-260,260,-520,520,-780,780,-1040,1040,-1320,1320,-1640,1640,-1960,1960];
  const placed=[];
  const originals=stage5BPlacements.map(p=>({...p}));
  for(const p of originals){
    const d=stage5BDefs?.[p.id]; if(!d)continue;
    const story=['hotdog','busstop','motoboy','coupleBench'].includes(p.id);
    const wallPad=story?54:34, treePad=story?92:58;
    let best=null,bestScore=Infinity;
    for(const off of offsets){
      const cand=spgNormalizeX(Math.round(p.wx+off+(off?((r()-.5)*18):0)),STAGE5_CYCLE);
      if(cand<24||cand+d.w>STAGE5_CYCLE-24)continue;
      const wallHits=spgProjectedConflictCount(cand,d.w,STAGE5_CYCLE,wallZones,wallPad,4);
      const treeHits=spgProjectedConflictCount(cand,d.w,STAGE5_CYCLE,treeZones,treePad,4);
      let localHits=0;
      for(const q of placed){
        const qd=stage5BDefs?.[q.id]; if(qd&&spgSameCycleGap(cand,d.w,q.wx,qd.w)<24)localHits++;
      }
      // Also avoid the already-finalized Step A/static character positions.
      for(const it of (stage5Items||[])){
        const ad=stage5AssetDefs?.[it.id]; if(!ad||it.id==='tree')continue;
        if(spgSameCycleGap(cand,d.w,it.wx,ad.w)<14)localHits++;
      }
      for(const v of (stage5V87Placements||[])){
        const vd=stage5V87Defs?.[v.id]; if(!vd||vd.layer!=='sidewalk')continue;
        const vw=Math.round(vd.w*(v.scale||1));
        if(spgSameCycleGap(cand,d.w,v.wx,vw)<28)localHits++;
      }
      const score=wallHits*1000+treeHits*700+localHits*100+Math.abs(off)/100;
      if(score<bestScore){bestScore=score;best=cand;}
      if(wallHits===0&&treeHits===0&&localHits===0){best=cand;break;}
    }
    if(best!==null)p.wx=best;
    placed.push(p);
  }
  stage5BPlacements=placed.sort((a,b)=>a.wx-b.wx);
  stage5BReserved=stage5BPlacements.map(p=>{
    const d=stage5BDefs[p.id];
    const pad=(p.id==='hotdog'||p.id==='busstop')?260:(p.id==='coupleBench'?210:(p.id==='motoboy'?170:130));
    return {x0:p.wx-pad,x1:p.wx+d.w+pad};

}
function spgRelocateProtectedSeatsForProtection(){
  if(!Array.isArray(stage12SeatPlacements)||!stage12SeatPlacements.length)return;
  const wallZones=spgProtectedWallZones();
  const treeZones=spgAllTreeZones();
  const r=stage5Rng((stage5Seed^0x1515D06A)>>>0);
  const protectedSeats=stage12SeatPlacements.filter(v=>!v.wallTop&&!spgSeatHas(v,'beerman')&&(v.chars||[]).some(ch=>['smoker','icecream','sharpei'].includes(ch.id)));
  const others=stage12SeatPlacements.filter(v=>!protectedSeats.includes(v));
  const placed=[];
  const offsets=[0,-260,260,-520,520,-780,780,-1040,1040,-1320,1320,-1600,1600,-1900,1900];
  for(const v of protectedSeats){
    const w=stage12SeatWidth(v),original=v.wx;
    let best=null,bestScore=Infinity;
    for(const off of offsets){
      const cand=spgNormalizeX(Math.round(original+off+(off?((r()-.5)*18):0)),STAGE5_CYCLE);
      if(cand<24||cand+w>STAGE5_CYCLE-24)continue;
      const wallHits=spgProjectedConflictCount(cand,w,STAGE5_CYCLE,wallZones,58,4);
      const treeHits=spgProjectedConflictCount(cand,w,STAGE5_CYCLE,treeZones,120,4);
      let localHits=stage12Blocked(cand,w,92)?1:0;
      for(const q of placed){if(spgSameCycleGap(cand,w,q.wx,stage12SeatWidth(q))<120)localHits++;}
      const score=wallHits*1000+treeHits*900+localHits*120+Math.abs(off)/100;
      if(score<bestScore){bestScore=score;best=cand;}
      if(wallHits===0&&treeHits===0&&localHits===0){best=cand;break;}
    }
    if(best!==null)v.wx=best;
    placed.push(v);
  }
  stage12SeatPlacements=[...others,...placed].sort((a,b)=>a.wx-b.wx);
}

// Priority/protected owners (wall-top, tree, smoker, ice-cream, Shar Pei, hot-dog,

const spgPassVisibility=new Map();
function spgPassVisible(key,xs,w,opts={}){
  if(!xs||!xs.length){spgPassVisibility.delete(key);return false;}
  // Only an actual wall-top occupant is absolute. "Protected" sidewalk owners own
  // their own footprint, but they still yield to a wall occupant or a tree.
  if(opts.wallTop){spgPassVisibility.set(key,true);return true;}
  if(!spgPassVisibility.has(key)){
    const allowed=xs.some(x=>spgScreenAllowed(x,w,opts));
    spgPassVisibility.set(key,allowed);
  }
  return spgPassVisibility.get(key)!==false;
}
function spgClearPassIfOffscreen(key,xs){if(!xs||!xs.length)spgPassVisibility.delete(key);}

// V13.15.3 — MAPA ÚNICO DE OCUPAÇÃO DO CENÁRIO
// Bloco 2 / correção estrutural de sobreposições.
// - Famílias continuam servindo SOMENTE para ritmo/repetição.
// - Ocupação física passa por um único registro para as camadas ativas da calçada.
// - Nenhum elemento estático principal é escondido durante o render para resolver conflito.
// - Conflitos entre ciclos diferentes (mureta 24k x calçada 11.8k) são resolvidos
//   por deslocamento persistente por passagem, escolhido antes de o asset entrar na tela.
// ============================================================================

const SPG153_PROTECTED_B_IDS=new Set(['hotdog','busstop','motoboy','coupleBench']);
const SPG153_PROTECTED_SEAT_IDS=new Set(['smoker','icecream','sharpei']);
let spg153WorldOccupancy=[];

function spg153WidthV87(p){
  const d=stage5V87Defs?.[p.id];
  return d?Math.round(d.w*(p.scale||1)):0;
}
function spg153SeatProtected(v){
  return !v.wallTop&&!spgSeatHas(v,'beerman')&&(v.chars||[]).some(ch=>SPG153_PROTECTED_SEAT_IDS.has(ch.id));
}
function spg153Gap(aWx,aW,bWx,bW){return spgCircularEdgeGap(aWx,aW,bWx,bW,STAGE5_CYCLE);}
function spg153ZoneHit(wx,w,z,pad=0){return spg153Gap(wx,w,z.wx,z.w)<((z.pad||0)+pad);}
function spg153HitsAny(wx,w,zones,pad=0){return (zones||[]).some(z=>spg153ZoneHit(wx,w,z,pad));}
function spg153Offsets(step=150,max=2250){
  const out=[0];
  for(let d=step;d<=max;d+=step){out.push(-d,d);}
  return out;
}
function spg153FindWorldSlot(original,w,zones,opts={}){
  const edge=opts.edge??26, pad=opts.pad??0, step=opts.step??150, max=opts.max??2250;
  const r=opts.rng||(()=>.5);
  let best=null,bestScore=Infinity;
  const test=(cand,move)=>{
    cand=spgNormalizeX(Math.round(cand),STAGE5_CYCLE);
    if(cand<edge||cand+w>STAGE5_CYCLE-edge)return null;
    let hits=0,depth=0;
    for(const z of zones){
      const g=spg153Gap(cand,w,z.wx,z.w),need=(z.pad||0)+pad;
      if(g<need){hits++;depth+=need-g;}
    }
    const score=hits*100000+depth*100+move;
    if(score<bestScore){bestScore=score;best=cand;}
    return hits===0?cand:null;
  };
  for(const off of spg153Offsets(step,max)){
    const jitter=off===0?0:Math.round((r()-.5)*18);
    const exact=test(original+off+jitter,Math.abs(off));
    if(exact!==null)return exact;
  }
  // Exhaustive fallback: preserve the occurrence; find the least-conflicted free slot.
  for(let x=edge;x<=STAGE5_CYCLE-w-edge;x+=38){
    const exact=test(x,Math.abs(x-original)+5000);
    if(exact!==null)return exact;
  }
  return best===null?spgNormalizeX(original,STAGE5_CYCLE):best;
}
function spg153Reserve(zones,wx,w,pad,id,kind){
  const z={wx:spgNormalizeX(wx,STAGE5_CYCLE),w,pad:pad||0,id:id||'',kind:kind||''};
  zones.push(z);return z;
}

function spg153ResolveUnifiedWorldOccupancy(){
  const zones=[];
  const r=stage5Rng((stage5Seed^0x1530CC01)>>>0);

  // PRIORIDADE 1 NO CICLO DA CALÇADA: árvores. Elas são donas da área de respiro.
  for(const it of (stage5Items||[])){
    if(it.id!=='tree')continue;
    const d=stage5AssetDefs?.tree;if(!d)continue;
    spg153Reserve(zones,it.wx,d.w,210,'tree','tree');
  }

  // PRIORIDADE 2: módulos Step B. Todos passam a reservar espaço entre si.
  // Isso elimina especificamente busstop x motoboy e qualquer combinação futura do Step B.
  if(Array.isArray(stage5BPlacements)){
    const ordered=stage5BPlacements.slice().sort((a,b)=>{
      const ap=SPG153_PROTECTED_B_IDS.has(a.id)?0:1,bp=SPG153_PROTECTED_B_IDS.has(b.id)?0:1;
      return ap-bp||a.wx-b.wx;
    });
    for(const p of ordered){
      const d=stage5BDefs?.[p.id];if(!d)continue;
      const isBig=SPG153_PROTECTED_B_IDS.has(p.id);
      const pad=isBig?72:34;
      p.wx=spg153FindWorldSlot(p.wx,d.w,zones,{pad,step:170,max:2550,rng:r});
      spg153Reserve(zones,p.wx,d.w,pad,p.id,'stage5B');
    }
    stage5BPlacements=ordered.sort((a,b)=>a.wx-b.wx);
    stage5BReserved=stage5BPlacements.map(p=>{
      const d=stage5BDefs[p.id],pad=SPG153_PROTECTED_B_IDS.has(p.id)?72:34;
      return {x0:p.wx-pad,x1:p.wx+d.w+pad};
    });
  }

  // PRIORIDADE 3: cluster fumante + sorvete + Shar Pei. Reserva o footprint inteiro.
  if(Array.isArray(stage12SeatPlacements)){
    const protectedSeats=stage12SeatPlacements.filter(spg153SeatProtected);
    for(const v of protectedSeats){
      const w=stage12SeatWidth(v),pad=92;
      v.wx=spg153FindWorldSlot(v.wx,w,zones,{pad,step:180,max:2700,rng:r});
      spg153Reserve(zones,v.wx,w,pad,'protectedSeat','stage12Seat');
    }
  }

  // PRIORIDADE 4: personagens/elementos standalone de calçada (V87).
  // Mantém todos; reposiciona somente se invadirem donos já registrados.
  if(Array.isArray(stage5V87Placements)){
    for(const p of stage5V87Placements){
      const d=stage5V87Defs?.[p.id];if(!d||d.layer!=='sidewalk')continue;
      const w=spg153WidthV87(p);if(!w)continue;
      p.wx=spg153FindWorldSlot(p.wx,w,zones,{pad:28,step:130,max:1950,rng:r});
      spg153Reserve(zones,p.wx,w,18,p.id,'v87');
    }
  }

  // PRIORIDADE 5: Step A / props soltos. As árvores já foram reservadas acima.
  // O slot nunca é apagado: ele é deslocado para o primeiro espaço válido.
  if(Array.isArray(stage5Items)){
    for(const it of stage5Items){
      if(it.id==='tree')continue;
      const d=stage5AssetDefs?.[it.id];if(!d)continue;
      it.wx=spg153FindWorldSlot(it.wx,d.w,zones,{pad:14,step:105,max:1680,rng:r});
      spg153Reserve(zones,it.wx,d.w,10,it.id,'stage5A');
    }
    stage5Items.sort((a,b)=>a.wx-b.wx);
  }

  spg153WorldOccupancy=zones;
}

// V13.15.4 — DISTRIBUIÇÃO NORMALIZADA / BLOCO 2
// - Remove pesos escondidos dos pools aleatórios sem reduzir a quantidade.
// - Cada ID de um pool recebe peso-base 1 via shuffle-bag equilibrado.
// - Cooldown individual continua valendo; famílias continuam SOMENTE para ritmo.
// - V87 e Stage11 são restaurados a partir da lista canônica antes do mapa de ocupação,
//   impedindo filtros legados de apagar phone/business ou um elemento da mureta.
// - Pombas permanecem a única exceção deliberada de alta frequência.
// - Nenhum ajuste de velocidade ou escala da árvore entra aqui.
// ============================================================================

const SPG154_STEPA_IDS=['crate','chair','tree','bin','boxes','bike','bag','cylinder','cart'];
const SPG154_STEPB_IDS=['hotdog','busstop','cone','barricade','coupleBench','skate','motoboy'];
const SPG154_STAGE11_IDS=['outdoor','fencePlain','sitYellow','sitDark','sitWomanHavaianas'];
const SPG154_V87_CANON=[
  {wx:620,id:'wallPosters'},
  {wx:4560,id:'phone'},
  {wx:5950,id:'business',scale:1.16},
  {wx:6900,id:'wallPosters'},
  {wx:8180,id:'phone'},
  {wx:12600,id:'business',scale:1.16}
];
const SPG154_CITY_SCATTER_NON_TREE=['boxesClean','benchClean','trashBin','planterClean','newsstandClean'];

function spg154Shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function spg154BalancedSequence(ids,count,r,lookback=3){
  const out=[],recent=[];let bag=[];
  while(out.length<count){
    if(!bag.length)bag=spg154Shuffle(ids,r);
    let idx=bag.findIndex(id=>!recent.includes(id));
    if(idx<0)idx=0;
    const id=bag.splice(idx,1)[0];out.push(id);
    recent.push(id);if(recent.length>lookback)recent.shift();
  }
  return out;
}
function spg154NormalizeStage5A(){
  if(!Array.isArray(stage5Items)||!stage5Items.length)return;
  const slots=stage5Items.slice().sort((a,b)=>a.wx-b.wx);
  const r=stage5Rng((stage5Seed^0x154A1101)>>>0);
  const seq=spg154BalancedSequence(SPG154_STEPA_IDS,slots.length,r,3);
  for(let i=0;i<slots.length;i++)slots[i].id=seq[i];
  stage5Items=slots;
}
function spg154NormalizeStage5B(){
  if(!Array.isArray(stage5BPlacements)||!stage5BPlacements.length)return;
  const slots=stage5BPlacements.slice().sort((a,b)=>a.wx-b.wx);
  const r=stage5Rng((stage5Seed^0x154B2202)>>>0);
  const seq=spg154BalancedSequence(SPG154_STEPB_IDS,slots.length,r,1);
  for(let i=0;i<slots.length;i++)slots[i].id=seq[i%seq.length];
  stage5BPlacements=slots;
  stage5BReserved=stage5BPlacements.map(p=>{
    const d=stage5BDefs[p.id],pad=(p.id==='hotdog'||p.id==='busstop')?260:(p.id==='coupleBench'?210:(p.id==='motoboy'?170:130));
    return {x0:p.wx-pad,x1:p.wx+d.w+pad};
  });
}
function spg154RestoreV87(){
  if(!Array.isArray(stage5V87Placements))return;
  stage5V87Placements.splice(0,stage5V87Placements.length,...SPG154_V87_CANON.map(p=>({...p})));
  rebuildStage5V87Reserved();
}
function spg154EnsureStage11(){
  if(!Array.isArray(stage11Placements))return;
  // One and only one occurrence of every active Stage11 asset.
  const kept=[],seen=new Set();
  for(const p of stage11Placements){if(SPG154_STAGE11_IDS.includes(p.id)&&!seen.has(p.id)){kept.push({...p});seen.add(p.id);}}

// ---------------------------------------------------------------------------
// PASS PLANNER — resolve a única incompatibilidade estrutural restante:
// a mureta usa um ciclo de 24k e a calçada usa 11.8k. Em vez de esconder/piscar,
// cada passagem visível recebe um deslocamento horizontal persistente ANTES de entrar.
// ---------------------------------------------------------------------------
let spg153FrameNo=0;
const spg153PassOffsetsMap=new Map(); // passKey -> {shift,last}
let spg153FramePlan=new Map();        // passKey -> shift
let spg153Reservations=[];

function spg153Copies(wx,cycle,w,margin=560){
  const scroll=((distance%cycle)+cycle)%cycle,base=wx-scroll;
  const xs=[base,base+cycle,base-cycle],out=[];
  for(const x of xs){
    if(x<=W+margin&&x+w>=-margin){
      const copy=Math.round((x+distance-wx)/cycle);
      out.push({x,copy});
    }
  }
  return out;
}
function spg153OverlapInterval(x,w,z,pad=0){return x<z.x1+pad&&x+w>z.x0-pad;}
function spg153ChoosePassShift(passKey,x,w,pad=8){
  const prev=spg153PassOffsetsMap.get(passKey);
  if(prev){prev.last=spg153FrameNo;return prev.shift;}
  const candidates=[0,-120,120,-240,240,-360,360,-480,480,-620,620,-760,760];
  let best=0,bestScore=Infinity;
  for(const shift of candidates){
    const xx=x+shift;
    let hits=0,depth=0;
    for(const z of spg153Reservations){
      if(spg153OverlapInterval(xx,w,z,pad)){
        hits++;
        depth+=Math.min(xx+w,z.x1)-Math.max(xx,z.x0);
      }
    }
    const score=hits*100000+Math.max(0,depth)*100+Math.abs(shift);
    if(score<bestScore){bestScore=score;best=shift;}
    if(hits===0){best=shift;break;}
  }
  spg153PassOffsetsMap.set(passKey,{shift:best,last:spg153FrameNo});
  return best;
}
function spg153PlanOne(baseKey,wx,cycle,w,pad=8,forcedShift=null){
  const copies=spg153Copies(wx,cycle,w,560);
  for(const c of copies){
    const k=`${baseKey}@${c.copy}`;
    let shift=forcedShift;
    if(shift===null)shift=spg153ChoosePassShift(k,c.x,w,pad);
    else spg153PassOffsetsMap.set(k,{shift,last:spg153FrameNo});
    spg153FramePlan.set(k,shift);
    const xx=c.x+shift;
    // Reserve even just outside viewport so later assets already know the incoming footprint.
    if(xx<=W+520&&xx+w>=-520)spg153Reservations.push({x0:xx,x1:xx+w,key:k});
  }
}
function spg153PlanFrameOccupancy(){
  spg153FrameNo++;
  spg153FramePlan.clear();spg153Reservations=[];
  const wallCycle=proceduralWallCycleWidth||24000;

  // 1) MURETA: absoluta. Nenhum deslocamento.
  for(let i=0;i<(stage11Placements||[]).length;i++){
    const p=stage11Placements[i],d=stage11Defs?.[p.id];if(!d)continue;
    spg153PlanOne(`wall:${i}:${p.id}`,p.wx,wallCycle,d.w,18,0);
  }
  for(let i=0;i<(stage12SeatPlacements||[]).length;i++){
    const v=stage12SeatPlacements[i];if(!v.wallTop&&!spgSeatHas(v,'beerman'))continue;

  }

  // 2) ÁRVORES: cedem somente à mureta e depois viram donas de área.

    const p=stage5BPlacements[i],d=stage5BDefs?.[p.id];if(!d)continue;
    spg153PlanOne(`s5b:${i}:${p.id}`,p.wx,STAGE5_CYCLE,d.w,SPG153_PROTECTED_B_IDS.has(p.id)?26:14,null);
  }

    const v=stage12SeatPlacements[i];if(!spg153SeatProtected(v))continue;
    spg153PlanOne(`s12seat:${i}`,v.wx,STAGE5_CYCLE,stage12SeatWidth(v),26,null);

  }

  // 6) Step A restante.
  for(let i=0;i<(stage5Items||[]).length;i++){
    const it=stage5Items[i];if(it.id==='tree')continue;
    const d=stage5AssetDefs?.[it.id];if(!d)continue;
    spg153PlanOne(`s5:${i}:${it.id}`,it.wx,STAGE5_CYCLE,d.w,8,null);
  }

  // Remove passes antigos somente depois que saíram completamente da zona de pré-planejamento.
  for(const [k,v] of spg153PassOffsetsMap){if(spg153FrameNo-v.last>6)spg153PassOffsetsMap.delete(k);}

function spg153DrawXs(baseKey,wx,cycle,w,margin=8){
  const out=[];

    const k=`${baseKey}@${c.copy}`;

    const x=c.x+shift;

// V13.24.21 — ETAPA 9C: ALEATORIEDADE + DENSIDADE + PROGRESSÃO DE DIFICULDADE
// Base: V13.24.20 aprovada/LOCK.
// LOCK preservado: física, controles, hitboxes, regras dos 7 obstáculos, HUD,
// trilhas, SFX, ponte/tráfego, cenário e assets.
//
// A dificuldade é contínua e combina os três sinais aprovados:
//   45% velocidade + 30% tempo sobrevivido + 25% pontuação.
// Ela altera somente ritmo/composição de spawn e nunca clearance/hitbox/física.

let spg9cRecentObstacleTypes=[];
let spg9cLastGroupKind='none';

function spg9cSmooth01(v){v=clamp(v,0,1);return v*v*(3-2*v);}
function spg9cDifficultyParts(){
  const kmh=displaySpeedKmh(speed);
  const speedT=spg9cSmooth01((kmh-7)/23);       // 7 -> 30 km/h
  const timeT=spg9cSmooth01(elapsed/105);       // full contribution around 1m45s
  const scoreT=spg9cSmooth01(score/6500);       // full contribution around 6500 pts
  const value=clamp(speedT*.45+timeT*.30+scoreT*.25,0,1);
  return {value,speedT,timeT,scoreT,kmh};
}
function spg9cDifficulty(){return spg9cDifficultyParts().value;}

// Existing callers keep using topSpeedPressure(), but from 9C onward it means
// the approved composite pressure rather than speed-only pressure.
topSpeedPressure=function(){return spg9cDifficulty();};

spawnGapRange=function(){
  const d=spg9cDifficulty();
  // Early run gets breathing room. Late run compresses continuously.
  return {min:lerp(500,255,d),max:lerp(760,390,d)};
};

function spg9cRemember(group){
  for(const o of group){
    spg9cRecentObstacleTypes.push(o.type);
    if(spg9cRecentObstacleTypes.length>5)spg9cRecentObstacleTypes.shift();
  }
}
function spg9cPickType(pool,d){
  const recent1=spg9cRecentObstacleTypes.slice(-1);
  const recent2=spg9cRecentObstacleTypes.slice(-2);
  const recent3=spg9cRecentObstacleTypes.slice(-3);
  let candidates=pool.filter(t=>!recent2.includes(t));
  if(!candidates.length)candidates=pool.filter(t=>!recent1.includes(t));
  if(!candidates.length)candidates=pool.slice();
  const weights=candidates.map(t=>{
    let w=1;
    if(t==='dog')w=lerp(.62,1.48,d);       // dynamic hazard grows with mastery
    else if(t==='person')w=lerp(.82,1.15,d);
    else if(t==='hole'||t==='bump')w=lerp(1.04,.94,d);
    if(recent3.includes(t))w*=.58;
    if(recent1.includes(t))w*=.22;
    return Math.max(.03,w);
  });
  let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;
  for(let i=0;i<candidates.length;i++){r-=weights[i];if(r<=0)return candidates[i];}
  return candidates[candidates.length-1];
}

// Same solvability validator as the LOCKed gameplay; only composition probabilities change.
generateGroup=function(){
  const staticTypes=['hole','bag','bump','puddle','manhole','person'];
  const gateTypes=['bag','puddle','manhole'];
  const d=spg9cDifficulty();

  // Continuous mix:
  // start  = 7% dog solo / 53% other single / 24% gate / 16% sequence
  // maximum=14% dog solo / 24% other single / 16% gate / 46% sequence
  const dogCut=lerp(.07,.14,d);
  const singleCut=dogCut+lerp(.53,.24,d);
  const gateCut=singleCut+lerp(.24,.16,d);

  for(let attempt=0;attempt<48;attempt++){
    const roll=Math.random();
    let group=[],kind='single';

    if(roll<dogCut && spg9cRecentObstacleTypes[spg9cRecentObstacleTypes.length-1]!=='dog'){
      // V13.24.22 QA: the dynamic dog can become more frequent late-game, but never twice in a row.
      group=[makeObstacle('dog',0)];kind='dog';
    }else if(roll<singleCut){
      group=[makeObstacle(spg9cPickType(staticTypes,d),0)];kind='single';
    }else if(roll<gateCut){
      const first=spg9cPickType(gateTypes,d);
      const second=spg9cPickType(gateTypes.filter(t=>t!==first),d);
      group=[makeObstacle(first,0),makeObstacle(second,0)];kind='gate';
    }else{
      const first=spg9cPickType(staticTypes,d);
      const second=spg9cPickType(staticTypes.filter(t=>t!==first),d);
      const a=typeDefs[first],b=typeDefs[second];
      const clearRoad=rand(lerp(205,128,d),lerp(290,180,d));
      const offset=(a.w+b.w)/2+clearRoad;
      group=[makeObstacle(first,0),makeObstacle(second,offset)];kind='sequence';
    }

    if(validGroup(group)){
      spg9cLastGroupKind=kind;
      spg9cRemember(group);
      return group;
    }
  }
  const fallback=[makeObstacle(spg9cPickType(typeKeys,d),0)];
  spg9cLastGroupKind='fallback';spg9cRemember(fallback);return fallback;
};

updateObstacles=function(dt,allowSpawn=true,worldSpeed=speed){
  // SPG 1.2 keeps the 9C difficulty logic, but uses the stronger progressive world-motion curve.
  const kmh=displaySpeedKmh(worldSpeed);
  const vx=worldSpeed*CFG.speedPxPerKmh*speedVisualMultiplier(kmh);distance+=vx*dt;

  if(allowSpawn&&distance>=nextSpawn){
    const d=spg9cDifficulty();
    const active=obstacles.filter(o=>o.x+o.def.w/2>-80&&o.x-o.def.w/2<W+180).length;
    const dynamicCap=d<.34?3:(d<.70?4:CFG.maxActiveObstacles);

    if(active<dynamicCap){
      const group=generateGroup();
      const clear=spawnGapRange();
      const newLeft=Math.min(...group.map(o=>o.x-o.def.w/2));
      const existingRight=obstacles.length?Math.max(...obstacles.map(o=>o.x+o.def.w/2)):-Infinity;
      const minScreenGap=lerp(142,64,d);

      if(existingRight!==-Infinity&&newLeft-existingRight<minScreenGap){
        // Never force an impossible pile-up: postpone the group instead.
        nextSpawn=distance+Math.max(58,minScreenGap-(newLeft-existingRight));
      }else{
        obstacles.push(...group);
        const groupSpan=Math.max(...group.map(o=>(o.x-(W+70))+o.def.w/2));
        // A difficult multi-hazard gets a small recovery window; this shrinks as mastery rises.
        let recovery=1;
        if(group.length>=2)recovery=lerp(1.18,1.06,d);
        else if(group[0]?.type==='dog')recovery=lerp(1.12,1.05,d);
        nextSpawn=distance+groupSpan+rand(clear.min,clear.max)*recovery;
      }
    }else{
      nextSpawn=distance+rand(lerp(125,82,d),lerp(175,125,d));
    }
  }

  for(const o of obstacles){
    o.x-=vx*dt;
    if(o.type==='dog')updateDog(o,dt);else o.age+=dt;
    if(!o.passed&&o.x+o.def.w/2<PLAYER_X-25){o.passed=true;registerObstacleClear(o);}
  }
  obstacles=obstacles.filter(o=>o.x+o.def.w/2>-100);
};
